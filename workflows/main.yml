name: Deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout historické ceny
        run: python update_history.py
        continue-on-error: true
      - name: Souhrn stažení
        if: always()
        run: cat status.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Uložit history.json do repozitáře
        run: |
          if [ -f history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git diff --cached --quiet || (git commit -m "Aktualizace history.json" && git push)
          fi
      - name: Připravit web
        run: |
          mkdir _site
          cp index.html data.json _site/
          cp history.json intraday.json _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
